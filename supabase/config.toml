# Minimal Supabase project config for Edge Functions.
# Deploy: supabase functions deploy submit-build
#         supabase functions deploy admin-builds
#         supabase functions deploy admin-reports
# Secrets: supabase secrets set BPB_SUBMIT_SECRET=...

[functions.submit-build]
verify_jwt = false

[functions.admin-builds]
verify_jwt = false

[functions.vote-build]
verify_jwt = false

[functions.create-checkout]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.create-portal]
verify_jwt = false

[functions.report-sim]
verify_jwt = false

[functions.admin-reports]
verify_jwt = false

[functions.site-access]
verify_jwt = false

# The function validates the caller JWT itself so it can return CORS-safe,
# application-level access outcomes. Gateway verification would reject the
# request before that signed-user check runs.
[functions.discord-guild]
verify_jwt = false

[functions.cosmetic-catalog]
verify_jwt = false

# Public result reader validates the event slug and only returns a build after
# the database visibility job marks the selected entry public.
[functions.event-winner]
verify_jwt = false

# Authenticated player submissions and owner-only moderation. The function
# validates the JWT and owner role itself so it can send CORS-safe errors.
[functions.cosmetic-submissions]
verify_jwt = false
